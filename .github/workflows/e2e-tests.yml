name: E2E Tests

on:
    push:
        branches:
            - main
    workflow_dispatch: # Allows manual triggering from GitHub UI
        inputs:
            test_filter:
                description: 'Test filter pattern (e.g., "Pass and score")'
                required: false
                default: ""

# Only the latest run matters: cancel any in-progress or queued run when a new
# push or manual dispatch lands. All events share one group on purpose —
# splitting workflow_dispatch into its own group can't actually protect manual
# runs, because run-tests.sh's preempt logic and the host-scoped cleanup step
# below would kill any concurrent run anyway.
concurrency:
    group: e2e-tests
    cancel-in-progress: true

jobs:
    e2e-tests:
        runs-on: self-hosted
        # A hung pytest/Playwright would otherwise hold the runner for GitHub's
        # default six hours, blocking every later run. Sized to a full merge run
        # (bring-up + pytest + build + quick + flaky + @Slow) with headroom.
        timeout-minutes: 45
        # Only run on the original repo, not forks
        if: github.repository == 'online-go/online-go.com'

        steps:
            # Nothing in this job touches the shared checkouts before run-tests.sh
            # holds its priority lock: another runner may be mid-run in them. The
            # script, and the helpers it finds beside itself, come from a private
            # clone of ogs main in this runner's own temp dir. Stale git locks, the
            # checkout of main, the pull and orphan-process cleanup all happen inside
            # the script, behind the lock.
            - name: Fetch run-tests.sh from ogs main (private clone)
              run: |
                  git clone --depth 1 --filter=blob:none --sparse --branch main \
                      git@github.com:online-go/ogs.git "$RUNNER_TEMP/ogs-e2e-ci"
                  git -C "$RUNNER_TEMP/ogs-e2e-ci" sparse-checkout set .e2e-ci

            - name: Determine trigger source
              id: trigger
              env:
                  EVENT_NAME: ${{ github.event_name }}
              run: |
                  if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                    echo "source=github-trigger" >> $GITHUB_OUTPUT
                  elif [ "$EVENT_NAME" = "push" ]; then
                    echo "source=ogs-ui" >> $GITHUB_OUTPUT
                  else
                    echo "source=unknown" >> $GITHUB_OUTPUT
                  fi

            - name: Run E2E Test Suite
              env:
                  TEST_FILTER: ${{ github.event.inputs.test_filter || '' }}
                  TRIGGER_SOURCE: ${{ steps.trigger.outputs.source }}
              run: |
                  "$RUNNER_TEMP/ogs-e2e-ci/.e2e-ci/run-tests.sh" "$TEST_FILTER" "$TRIGGER_SOURCE"
