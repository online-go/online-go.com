name: Claude Code Review

on:
  pull_request_target:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # Workaround for an upstream sandbox bug. `allowed_non_write_users` makes
      # the action install bubblewrap. Claude Code 2.1.216 and later ask
      # bubblewrap to mount /dev/null over config files such as $HOME/.mcp.json,
      # to stop a command from creating them. Here $HOME resolves to /home,
      # which the runner user cannot write. Bubblewrap cannot create the mount
      # point, so every Bash command fails and the review never runs. Make
      # /home writable so bubblewrap can create the mount points it needs.
      # Remove this step when the upstream bug is fixed.
      # The sticky bit lets any user create entries, but only the owner can
      # remove or rename them, as with /tmp.
      - name: Make sandbox mount points creatable
        run: sudo chmod 1777 /home

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_non_write_users: '*'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please analyze this pull request for bugs and performance issues. If
            you find any, please leave concise professional comments describing what you
            found. Avoid nit picking. If everything looks good, leave a quick "looks good to
            me" comment, providing concise positive feedback if appropriate.

            After your first pass, please verify your analysis and remove any comments that are not
            relevant or accurate, or that turned out to not be real issues.

            For findings tied to specific lines, use the
            `mcp__github_inline_comment__create_inline_comment` tool to comment directly on
            those lines rather than describing the location in prose. Use `startLine` with
            `line` for a range. Where you can name the exact replacement, include a
            ```suggestion``` block so the author can apply it in one click; the block
            replaces the entire line range, so make sure it is syntactically complete.

            Use `gh pr comment` with your Bash tool for the overall summary, and to leave
            your "looks good to me" when there is nothing line-specific to raise.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://docs.claude.com/en/docs/claude-code/cli-reference for available options
          claude_args: '--allowed-tools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

